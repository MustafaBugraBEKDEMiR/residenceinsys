<!DOCTYPE html>
<html>
<head>

    <title>Resident Information System</title>

    <style> 
    body{
		background-color: #91bbe9;
	}

</head>
<body>
    <form method="GET" action="{% url 'index' %}">

    <div id="map">{{ map|safe }}</div>
