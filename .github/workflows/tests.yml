name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ris
          POSTGRES_USER: ris
          POSTGRES_PASSWORD: ris
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ris" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgis://ris:ris@localhost:5432/ris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev
      - run: pip install -r requirements.txt
      - run: pytest
